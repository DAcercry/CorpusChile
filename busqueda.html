<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tramites — CorpusChile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #111827;
    --ink-soft: #374151;
    --grey: #6B7280;
    --grey-line: #D8DCE3;
    --paper: #FCFCFB;
    --paper-raised: #FFFFFF;
    --accent: #003B82;
    --accent-deep: #002A5C;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  html[data-theme="dark"]{
    --ink: #EDEAF4;
    --ink-soft: #C9C3DA;
    --grey: #8B84A3;
    --grey-line: #322C42;
    --paper: #15121D;
    --paper-raised: #1C1826;
    --accent: #9D6DF0;
    --accent-deep: #B892F5;
  }
  html{ background: var(--paper); }
  *{ box-sizing: border-box; }
  ::selection{ background: var(--accent); color: #fff; }
  body{
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
  }
  a{ color: var(--accent); text-decoration: none; }
  a:hover{ color: var(--accent-deep); text-decoration: underline; }

  .topbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 28px;
    background: var(--paper-raised);
    border-bottom: 1px solid var(--grey-line);
  }
  .topbar a.home-link{
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }
  .topbar a.home-link:hover{ color: var(--accent); text-decoration: none; }
  .theme-btn{
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border: 1px solid var(--grey-line);
    border-radius: 3px;
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .theme-btn:hover{ color: var(--accent); border-color: var(--accent); }

  main{
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .search-view-back{
    display: inline-block;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 0 0 16px;
    font-family: var(--sans);
  }
  .search-view-back:hover{ color: var(--accent-deep); text-decoration: underline; }
  .search-view-title{
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .search-view-subtitle{
    font-size: 12.5px;
    color: var(--grey);
    margin: 0 0 20px;
  }
  .search-view-filters{
    display: flex;
    gap: 20px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--grey-line);
  }
  .search-view-filters label{
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11.5px;
    color: var(--grey);
    font-family: var(--sans);
  }
  .search-view-filters select{
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--grey-line);
    border-radius: 3px;
    padding: 6px 8px;
  }
  .results-count{
    font-size: 12.5px;
    color: var(--grey);
    margin: 0 0 10px;
  }
  .results-count strong{ color: var(--ink-soft); font-weight: 600; }
  .no-results-view{
    padding: 20px 0;
    color: var(--grey);
    font-family: var(--serif);
    font-size: 14px;
  }

  .fulltext-item{
    padding: 14px 2px;
    border-bottom: 1px solid var(--grey-line);
  }
  .fulltext-item:first-child{ border-top: 1px solid var(--grey-line); }
  .fulltext-title{
    display: block;
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    margin-bottom: 2px;
  }
  .fulltext-title:hover{ color: var(--accent-deep); }
  .fulltext-count{
    display: block;
    font-size: 11.5px;
    color: var(--grey);
    margin-bottom: 8px;
  }
  .fulltext-snippets{
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .fulltext-snippets li{
    font-size: 12.5px;
    color: var(--grey);
    line-height: 1.6;
    padding: 5px 0;
  }
  .show-more-btn{
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: none;
    border: none;
    padding: 4px 0 0;
    cursor: pointer;
    font-family: var(--sans);
  }
  .show-more-btn:hover{ color: var(--accent-deep); text-decoration: underline; }
</style>
</head>
<body>

  <header class="topbar">
    <a class="home-link" href="index.html">← CorpusChile</a>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar a modo oscuro">
      <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>

  <main>
    <a class="search-view-back" href="index.html">← Volver a la portada</a>
    <h1 class="search-view-title">Resultados para "<span id="searchViewQuery"></span>"</h1>
    <p class="search-view-subtitle">¿Que tramite quieres hacer Hoy?</p>

    <div class="search-view-filters">
      <label>Lista
        <select id="filterYear"><option value="">Todos</option></select>
      </label>
      <label>Tipo
        <select id="filterDay"><option value="">Todos</option></select>
      </label>
    </div>

    <p class="results-count" id="searchViewCount"></p>
    <div id="searchViewList"></div>
  </main>

<script src="assets/js/corpus-data.js"></script>
<script>
  // Esta página SÍ es un archivo real y distinto (busqueda.html), con su
  // propia URL que GitHub Pages sirve directamente — a diferencia de un
  // simple #hash dentro de index.html, que nunca llega al servidor.
  const params = new URLSearchParams(location.search);
  const rawQuery = params.get('q') || '';
  document.getElementById('searchViewQuery').textContent = rawQuery;

  const claveunica = document.getElementById('filterYear');
  const cedula_de_identidad = document.getElementById('filterDay');
  const beca = document.getElementById('searchViewList');
  const searchViewCount = document.getElementById('searchViewCount');

  
  // Modo oscuro/claro, igual que en la portada
  const themeBtn = document.getElementById('themeBtn');
  const themeIconSun = document.getElementById('themeIconSun');
  const themeIconMoon = document.getElementById('themeIconMoon');
  themeBtn.addEventListener('click', () => {
    const isDark = document.documentElement.dataset.theme === 'dark';
    if(isDark){
      document.documentElement.removeAttribute('data-theme');
      themeIconSun.style.display = '';
      themeIconMoon.style.display = 'none';
    } else {
      document.documentElement.dataset.theme = 'dark';
      themeIconSun.style.display = 'none';
      themeIconMoon.style.display = '';
    }
  });
</script>

</body>
</html>
