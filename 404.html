<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada | CorpusChile</title>
  <link rel="icon" href="logo-mono.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #e8e0f0;
      font-family: "Times New Roman", Times, serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    /* Logo abajo izquierda, sin recuadro */
    .logo {
      position: absolute;
      bottom: 7%;
      left: 5%;
      z-index: 2;
    }

    .logo img {
      height: 52px;
      width: auto;
      display: block;
      opacity: 0.95;
    }

    .logo a {
      display: block;
      line-height: 0;
    }

    /* Dato de la base — arriba derecha, sin recuadro */
    .dato {
      position: absolute;
      top: 12%;
      right: 6%;
      max-width: 380px;
      text-align: right;
      z-index: 2;
    }

    .dato-label {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a78bfa; /* lila / purple claro */
      margin-bottom: 10px;
      font-family: "Times New Roman", Times, serif;
    }

    .dato-text {
      font-size: 1.15rem;
      line-height: 1.5;
      color: #f5f3ff; /* blanco suave */
      font-weight: 400;
    }

    /* Contenido central */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      z-index: 1;
    }

    .error-code {
      font-size: clamp(5rem, 14vw, 8rem);
      font-weight: 400;
      color: #c4b5fd; /* lila claro */
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 8px;
    }

    .error-title {
      font-size: 1.4rem;
      color: #ddd6fe;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 24px;
      font-weight: 400;
    }

    .error-msg {
      font-size: 1.05rem;
      color: #c4b5fd;
      max-width: 420px;
      line-height: 1.55;
      margin-bottom: 36px;
      opacity: 0.9;
    }

    .btn-home {
      display: inline-block;
      background: #7c3aed; /* morado principal */
      color: #faf5ff;
      padding: 13px 32px;
      font-family: "Times New Roman", Times, serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-decoration: none;
      border: none;
      border-radius: 999px; /* redondo */
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn-home:hover {
      background: #6d28d9;
      transform: translateY(-1px);
    }

    .footer-hint {
      position: absolute;
      bottom: 3%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #6b5b8a;
      letter-spacing: 0.04em;
    }

    @media (max-width: 700px) {
      .dato {
        top: 6%;
        right: 5%;
        left: 5%;
        max-width: none;
        text-align: center;
      }
      .logo {
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
      }
      .error-code {
        font-size: 4.5rem;
      }
      .footer-hint {
        bottom: 2%;
      }
    }
  </style>
</head>
<body>

  <!-- Logo sin recuadro -->
  <div class="logo">
    <a href="https://corpuschile.cl/" title="CorpusChile">
      <img src="logo-mono.png" alt="CorpusChile" width="52" height="52">
    </a>
  </div>

  <!-- Dato de la base sin recuadro -->
  <div class="dato" id="datoBox">
    <div class="dato-label">Dato de la base</div>
    <div class="dato-text" id="datoText">Cargando…</div>
  </div>

  <!-- Centro -->
  <div class="center">
    <div class="error-code">404</div>
    <div class="error-title">Página no encontrada</div>
    <p class="error-msg">
      El recurso que buscas no existe en este corpus.<br>
      Mientras tanto, aquí tienes un dato oficial del Estado de Chile.
    </p>
    <a class="btn-home" href="https://corpuschile.cl/">Volver al inicio</a>
  </div>

  <div class="footer-hint">CorpusChile · datos del Estado de Chile</div>

  <script>
    const datos = [
      "Chile es un Estado unitario.",
      "La capital de Chile es Santiago.",
      "El Estado chileno se organiza en tres poderes principales.",
      "El Poder Ejecutivo es encabezado por el Presidente de la República.",
      "El Presidente de Chile ejerce como Jefe de Estado y Jefe de Gobierno.",
      "El período presidencial dura cuatro años.",
      "La reelección presidencial inmediata no está permitida.",
      "El Poder Legislativo está conformado por el Congreso Nacional.",
      "El Congreso Nacional es bicameral.",
      "El Senado es una de las cámaras del Congreso.",
      "La Cámara de Diputadas y Diputados es la otra cámara del Congreso.",
      "El Poder Judicial es independiente de los demás poderes.",
      "La Corte Suprema es el máximo tribunal del país.",
      "Chile posee una Constitución Política.",
      "La Constitución vigente entró en vigor en 1980.",
      "El Estado chileno reconoce y protege derechos fundamentales.",
      "El sufragio en Chile es voluntario.",
      "La inscripción electoral es automática.",
      "Chile está dividido en 16 regiones.",
      "Cada región cuenta con un Gobierno Regional.",
      "Las regiones están subdivididas en provincias.",
      "Las provincias son administradas por delegaciones presidenciales.",
      "Las comunas constituyen la unidad territorial básica.",
      "Cada comuna posee una municipalidad.",
      "Los alcaldes son elegidos por votación popular.",
      "Los concejales también son elegidos democráticamente.",
      "El Estado chileno recauda impuestos.",
      "El Servicio de Impuestos Internos administra la fiscalización tributaria.",
      "La Tesorería General de la República recauda recursos fiscales.",
      "El Banco Central de Chile es autónomo.",
      "El Banco Central no forma parte del Gobierno.",
      "La Contraloría General de la República fiscaliza la legalidad de los actos administrativos.",
      "La Contraloría es un órgano autónomo.",
      "El Tribunal Constitucional forma parte de la institucionalidad del Estado.",
      "Chile cuenta con un Ministerio del Interior y Seguridad Pública.",
      "Chile tiene un Ministerio de Hacienda.",
      "Chile posee un Ministerio de Educación.",
      "Chile cuenta con un Ministerio de Salud.",
      "Chile posee un Ministerio de Defensa Nacional.",
      "Los ministerios colaboran con el Presidente de la República.",
      "El Estado chileno financia establecimientos educacionales públicos.",
      "El Estado administra hospitales públicos.",
      "El Fondo Nacional de Salud se conoce como FONASA.",
      "FONASA es parte del sistema público de salud.",
      "Carabineros de Chile es una institución policial estatal.",
      "La Policía de Investigaciones de Chile pertenece al Estado.",
      "Las Fuerzas Armadas dependen del Estado chileno.",
      "El Ejército de Chile integra las Fuerzas Armadas.",
      "La Armada de Chile integra las Fuerzas Armadas.",
      "La Fuerza Aérea de Chile integra las Fuerzas Armadas.",
      "El Estado chileno mantiene relaciones diplomáticas con numerosos países.",
      "El Ministerio de Relaciones Exteriores dirige la política exterior.",
      "Chile participa en organismos internacionales.",
      "Chile es miembro de las Naciones Unidas.",
      "Chile es miembro de la OEA.",
      "El Estado promueve el desarrollo económico.",
      "El Presupuesto de la Nación se aprueba anualmente.",
      "El Presidente presenta el proyecto de Ley de Presupuestos.",
      "El Congreso revisa la Ley de Presupuestos.",
      "El Estado regula diversos mercados.",
      "La Comisión para el Mercado Financiero supervisa entidades financieras.",
      "Chile posee empresas estatales.",
      "CODELCO es una empresa estatal chilena.",
      "ENAP es una empresa estatal.",
      "BancoEstado pertenece al Estado chileno.",
      "El Estado administra parques nacionales mediante organismos competentes.",
      "El Estado protege el patrimonio cultural.",
      "El Servicio Electoral se conoce como SERVEL.",
      "SERVEL organiza y supervisa elecciones.",
      "El voto de los chilenos en el extranjero está permitido.",
      "El Estado mantiene registros civiles.",
      "El Registro Civil emite cédulas de identidad.",
      "El Registro Civil inscribe nacimientos.",
      "El Registro Civil inscribe matrimonios.",
      "El Registro Civil inscribe defunciones.",
      "La nacionalidad chilena puede adquirirse por nacimiento.",
      "La nacionalidad también puede obtenerse por carta de nacionalización.",
      "El Estado reconoce la igualdad ante la ley.",
      "Chile posee tribunales especializados.",
      "Existen tribunales de familia.",
      "Existen tribunales laborales.",
      "Existen tribunales ambientales.",
      "El Ministerio Público dirige las investigaciones penales.",
      "El Fiscal Nacional encabeza el Ministerio Público.",
      "La Defensoría Penal Pública proporciona defensa jurídica.",
      "El Estado promueve la descentralización administrativa.",
      "Los gobernadores regionales son elegidos por sufragio.",
      "El Estado administra bienes nacionales de uso público.",
      "Las playas son bienes nacionales de uso público.",
      "Las calles públicas son bienes nacionales de uso público.",
      "El Estado lleva estadísticas oficiales mediante el INE.",
      "El INE significa Instituto Nacional de Estadísticas.",
      "Los censos son coordinados por el INE.",
      "El Estado implementa políticas sociales.",
      "El Estado financia programas de vivienda.",
      "El Estado administra subsidios para distintos grupos sociales.",
      "Chile se define constitucionalmente como una república democrática.",
      "La soberanía reside esencialmente en la nación.",
      "El Estado chileno debe resguardar el orden público.",
      "El Estado chileno tiene personalidad jurídica de derecho público."
    ];

    let ultimoIdx = -1;

    function mostrarDato() {
      let idx;
      // Algoritmo aleatorio que evita repetir el mismo dato seguido
      do {
        idx = Math.floor(Math.random() * datos.length);
      } while (idx === ultimoIdx && datos.length > 1);
      ultimoIdx = idx;
      document.getElementById("datoText").textContent = datos[idx];
    }

    // Mostrar un dato aleatorio al cargar la página
    mostrarDato();

    // Al hacer clic en el dato, muestra otro aleatorio
    document.getElementById("datoBox").addEventListener("click", mostrarDato);
  </script>
</body>
</html>
