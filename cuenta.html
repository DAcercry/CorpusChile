<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — CorpusChile</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111827; --ink-soft:#374151; --grey:#6B7280; --grey-line:#D8DCE3;
    --paper:#FCFCFB; --paper-raised:#fff; --accent:#003B82; --accent-deep:#002A5C;
    --serif:'Source Serif 4', Georgia, serif; --sans: Inter, system-ui, sans-serif;
    --ok:#166534; --err:#991b1b;
  }
  html[data-theme="dark"]{
    --ink:#EDEAF4; --ink-soft:#C9C3DA; --grey:#8B84A3; --grey-line:#322C42;
    --paper:#15121D; --paper-raised:#1C1826; --accent:#9D6DF0; --accent-deep:#B892F5;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:var(--sans); color:var(--ink);
    background:var(--paper); display:flex; flex-direction:column;
  }
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  .top{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; border-bottom:1px solid var(--grey-line); background:var(--paper-raised);
  }
  .brand{display:flex; align-items:center; gap:10px; color:var(--ink); font-family:var(--serif); font-weight:600; font-size:1.15rem}
  .brand img{height:32px; width:auto}
  .wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px}
  .card{
    width:100%; max-width:420px; background:var(--paper-raised);
    border:1px solid var(--grey-line); border-radius:12px; padding:28px 26px;
    box-shadow:0 8px 30px rgba(0,0,0,.04);
  }
  h1{font-family:var(--serif); font-size:1.55rem; margin:0 0 6px; font-weight:700}
  .sub{color:var(--grey); font-size:.92rem; margin:0 0 22px; line-height:1.45}
  label{display:block; font-size:.82rem; font-weight:500; color:var(--ink-soft); margin:0 0 6px}
  .field{margin-bottom:14px}
  input{
    width:100%; padding:10px 12px; border:1px solid var(--grey-line); border-radius:6px;
    font:inherit; color:var(--ink); background:var(--paper); outline:none;
  }
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent)}
  .btn{
    width:100%; margin-top:8px; padding:11px 14px; border:0; border-radius:6px;
    background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer;
  }
  .btn:hover{background:var(--accent-deep)}
  .btn:disabled{opacity:.6; cursor:not-allowed}
  .btn-ghost{
    width:100%; margin-top:10px; padding:10px; border:1px solid var(--grey-line);
    border-radius:6px; background:transparent; color:var(--ink); font:inherit; cursor:pointer;
  }
  .switch{text-align:center; margin-top:16px; font-size:.9rem; color:var(--grey)}
  .switch button{background:none; border:0; color:var(--accent); font:inherit; cursor:pointer; font-weight:500}
  .msg{margin-top:14px; padding:10px 12px; border-radius:6px; font-size:.9rem; display:none}
  .msg.ok{display:block; background:#dcfce7; color:var(--ok)}
  .msg.err{display:block; background:#fee2e2; color:var(--err)}
  html[data-theme="dark"] .msg.ok{background:#14532d; color:#bbf7d0}
  html[data-theme="dark"] .msg.err{background:#7f1d1d; color:#fecaca}
  .note{margin-top:18px; font-size:.8rem; color:var(--grey); line-height:1.4}
  .tabs{display:flex; gap:8px; margin-bottom:18px}
  .tabs button{
    flex:1; padding:8px; border:1px solid var(--grey-line); border-radius:6px;
    background:transparent; font:inherit; cursor:pointer; color:var(--ink-soft);
  }
  .tabs button.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600}
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">
      <img src="assets/logo-color.png" alt="" onerror="this.style.display='none'">
      CorpusChile
    </a>
    <a href="index.html">← Volver al buscador</a>
  </header>

  <main class="wrap">
    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" class="active" id="tabRegister" role="tab">Crear cuenta</button>
        <button type="button" id="tabLogin" role="tab">Iniciar sesión</button>
      </div>

      <h1 id="formTitle">Crear cuenta</h1>
      <p class="sub" id="formSub">Te enviaremos un correo para confirmar la creación de tu cuenta.</p>

      <form id="authForm" autocomplete="on">
        <div class="field" id="nameField">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" placeholder="Tu nombre" required>
        </div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" placeholder="tu@correo.cl" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </div>
        <button class="btn" type="submit" id="submitBtn">Crear cuenta y enviar correo</button>
      </form>

      <div class="msg" id="msg" role="status"></div>

      <p class="note">
        Al crear una cuenta se envía un mensaje a tu correo (y opcionalmente al administrador)
        mediante <strong>EmailJS</strong>. Configura las claves en <code>js/auth.js</code>.
      </p>
    </div>
  </main>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const tabRegister = document.getElementById('tabRegister');
    const tabLogin = document.getElementById('tabLogin');
    const formTitle = document.getElementById('formTitle');
    const formSub = document.getElementById('formSub');
    const nameField = document.getElementById('nameField');
    const submitBtn = document.getElementById('submitBtn');
    const form = document.getElementById('authForm');
    const msg = document.getElementById('msg');

    let mode = 'register';

    function setMode(next) {
      mode = next;
      const isReg = mode === 'register';
      tabRegister.classList.toggle('active', isReg);
      tabLogin.classList.toggle('active', !isReg);
      nameField.style.display = isReg ? '' : 'none';
      document.getElementById('name').required = isReg;
      formTitle.textContent = isReg ? 'Crear cuenta' : 'Iniciar sesión';
      formSub.textContent = isReg
        ? 'Te enviaremos un correo para confirmar la creación de tu cuenta.'
        : 'Entra con el correo y contraseña de tu cuenta.';
      submitBtn.textContent = isReg ? 'Crear cuenta y enviar correo' : 'Entrar';
      msg.className = 'msg';
      msg.textContent = '';
    }

    tabRegister.addEventListener('click', () => setMode('register'));
    tabLogin.addEventListener('click', () => setMode('login'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      submitBtn.disabled = true;

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      };

      try {
        if (mode === 'register') {
          const result = await CorpusAuth.registerAccount(payload);
          const sim = result.mail && result.mail.simulated;
          msg.className = 'msg ok';
          msg.textContent = sim
            ? 'Cuenta creada en este navegador. (EmailJS aún no está configurado: no se envió correo real.)'
            : 'Cuenta creada. Revisa tu correo: te enviamos un mensaje de confirmación.';
          form.reset();
        } else {
          CorpusAuth.loginAccount(payload);
          msg.className = 'msg ok';
          msg.textContent = 'Sesión iniciada. Redirigiendo…';
          setTimeout(() => { location.href = 'index.html'; }, 800);
        }
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message || 'No se pudo completar la solicitud.';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Si ya hay sesión, avisar
    const session = CorpusAuth.currentUser();
    if (session) {
      msg.className = 'msg ok';
      msg.textContent = 'Ya tienes sesión como ' + session.name + ' (' + session.email + ').';
    }
  </script>
</body>
</html>
