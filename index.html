<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorpusChile – Buscador Documental</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="logo">CorpusChile</div>
    <div class="header-right">
      <div id="clock" class="clock"></div>
      <button id="theme-toggle" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <main>
    <section class="search-section">
      <h1>Buscador Documental</h1>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar por título, autor, palabras clave o texto completo...">
        <button id="search-btn">Buscar</button>
      </div>
      <div class="filters">
        <select id="filter-type">
          <option value="">Todos los tipos</option>
          <option value="decreto">Decreto</option>
          <option value="ley">Ley</option>
          <option value="resolucion">Resolución</option>
          <option value="otro">Otro</option>
        </select>
      </div>
    </section>

    <section class="results-section">
      <div id="results-count"></div>
      <div id="results" class="cards"></div>
    </section>
  </main>

  <!-- Panel de detalle -->
  <div id="detail-panel" class="detail-panel hidden">
    <div class="detail-content">
      <button id="close-detail">✕</button>
      <h2 id="detail-title"></h2>
      <div class="detail-meta" id="detail-meta"></div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
